version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      web-toolchain:
        patterns:
          - "vite"
          - "vite-plugin-pwa"
          - "typescript"
          - "lit"
      tauri-js:
        patterns:
          - "@tauri-apps/*"

  - package-ecosystem: cargo
    directory: /crates/scanner-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
