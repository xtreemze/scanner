name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - run: corepack enable
      - run: corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  sensor-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - run: cargo check --manifest-path plugins/scanner-sensors/Cargo.toml --all-targets
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Validate Android JNI shim against scanner-core ABI
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only             -I"$JAVA_HOME/include"             -I"$JAVA_HOME/include/linux"             -Inative             plugins/scanner-sensors/android/src/main/cpp/scanner_core_jni.c
      - name: Validate 16 KB JNI link alignment recipe
        run: |
          cc -std=c11 -Wall -Wextra -Werror -shared -fPIC             -I"$JAVA_HOME/include"             -I"$JAVA_HOME/include/linux"             -Inative             plugins/scanner-sensors/android/src/main/cpp/scanner_core_jni.c             -ldl             -Wl,-z,max-page-size=16384             -Wl,-z,common-page-size=16384             -o /tmp/libscanner_sensors_jni.so
          readelf -lW /tmp/libscanner_sensors_jni.so | awk '
            $1 == "LOAD" {
              if ($NF != "0x4000") {
                printf "unexpected LOAD alignment: %s\n", $NF > "/dev/stderr"
                exit 1
              }
              seen = 1
            }
            END {
              if (!seen) {
                print "no LOAD segments found" > "/dev/stderr"
                exit 1
              }
            }'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - run: cargo test --manifest-path crates/scanner-core/Cargo.toml --all-targets --locked
      - name: Build scanner-core native library artifacts
        run: cargo build --manifest-path crates/scanner-core/Cargo.toml --lib --locked
      - name: Validate native C ABI header
        run: |
          cmp native/scanner_core.h plugins/scanner-sensors/ios/Sources/ScannerCoreFFI/include/scanner_core.h
          printf '#include "scanner_core.h"\nint main(void) { return 0; }\n' | cc -x c -fsyntax-only -I native -
      - name: Validate Tauri lockfile resolution
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps > /dev/null

  android-generated:
    name: android-generated (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tauri_target: aarch64
            rust_target: aarch64-linux-android
            abi: arm64-v8a
          - tauri_target: armv7
            rust_target: armv7-linux-androideabi
            abi: armeabi-v7a
          - tauri_target: i686
            rust_target: i686-linux-android
            abi: x86
          - tauri_target: x86_64
            rust_target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install stable Android 16 and NDK r30 toolchain
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - run: corepack enable
      - run: corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Generate Tauri Android project
        run: pnpm tauri android init --ci --skip-targets-install
      - name: Keep generated Android project on latest stable SDK
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --include='*.gradle.kts' --include='*.gradle' '37' src-tauri/gen/android |
            while IFS= read -r file; do
              sed -i -E \
                -e 's/(compileSdk[[:space:]]*=[[:space:]]*)37/\136/g' \
                -e 's/(targetSdk[[:space:]]*=[[:space:]]*)37/\136/g' \
                "$file"
            done
          if grep -RInE --include='*.gradle.kts' --include='*.gradle' '(compileSdk|targetSdk)[[:space:]]*=[[:space:]]*37' src-tauri/gen/android; then
            echo "Generated Android project still requires preview API 37" >&2
            exit 1
          fi
      - name: Build ${{ matrix.abi }} Android APK
        run: pnpm tauri android build --debug --apk --target ${{ matrix.tauri_target }} --ci
      - name: Validate ${{ matrix.abi }} packaged native libraries
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find src-tauri/gen/android -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "No generated APK found" >&2
            exit 1
          fi
          echo "Validating $APK for ${{ matrix.abi }}"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

          rm -rf /tmp/scanner-apk
          mkdir -p /tmp/scanner-apk
          unzip -q "$APK" 'lib/*/*.so' -d /tmp/scanner-apk

          while IFS= read -r -d '' so; do
            echo "Inspecting $so"
            while read -r alignment; do
              value=$((alignment))
              if (( value < 16384 )); then
                echo "$so has LOAD alignment $alignment (< 16 KB)" >&2
                exit 1
              fi
            done < <(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          done < <(find /tmp/scanner-apk -type f -name '*.so' -print0)

          CORE_SO="/tmp/scanner-apk/lib/${{ matrix.abi }}/libscanner_lib.so"
          JNI_SO="/tmp/scanner-apk/lib/${{ matrix.abi }}/libscanner_sensors_jni.so"

          if [[ ! -f "$CORE_SO" ]]; then
            echo "Missing Scanner Rust library for ${{ matrix.abi }}: $CORE_SO" >&2
            exit 1
          fi
          if [[ ! -f "$JNI_SO" ]]; then
            echo "Missing Scanner JNI shim for ${{ matrix.abi }}: $JNI_SO" >&2
            exit 1
          fi

          nm -D "$CORE_SO" | grep -q 'scanner_native_session_create' || {
            echo "scanner-core ingestion ABI symbol missing from $CORE_SO" >&2
            exit 1
          }
          nm -D "$JNI_SO" | grep -q 'Java_com_xtreemze_scanner_sensors_ScannerCoreIngestBridge_nativeCreate' || {
            echo "ScannerCoreIngestBridge JNI entry point missing from $JNI_SO" >&2
            exit 1
          }
