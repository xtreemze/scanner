name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - run: corepack enable
      - run: corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - run: cargo test --manifest-path crates/scanner-core/Cargo.toml --all-targets --locked
      - name: Validate Tauri lockfile resolution
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps > /dev/null
